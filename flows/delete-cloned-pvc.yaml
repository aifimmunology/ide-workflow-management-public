#
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: delete-cloned-pvc-
spec:
  entrypoint: do-delete
  arguments:
    parameters:
      - name: pvc_guid
  templates: 
  - name: do-delete
    steps:
    - - name: delete-userdisk-clone
        template: delete-userdisk-clone
    - - name: delete-userdisk-snapshot
        template: delete-userdisk-snapshot

  - name: delete-userdisk-clone
    resource:
      action: delete
      flags: ["--ignore-not-found"]      
      manifest: |
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: cloned-udisk-{{workflow.parameters.pvc_guid}}

  - name: delete-userdisk-snapshot
    resource:
      action: delete
      flags: ["--ignore-not-found"]
      manifest: |
        apiVersion: snapshot.storage.k8s.io/v1
        kind: VolumeSnapshot
        metadata:
          name: udisk-snapshot-{{workflow.parameters.pvc_guid}}